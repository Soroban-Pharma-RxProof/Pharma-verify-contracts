[package]
name = "rxproof-contracts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban Pharma RxProof - Counterfeit Medicine Verification & Supply Chain Smart Contract"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.8"

[dev-dependencies]
soroban-sdk = { version = "22.0.8", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
