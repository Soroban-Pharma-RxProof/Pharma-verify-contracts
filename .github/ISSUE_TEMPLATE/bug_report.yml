name: Bug Report
description: Report an issue or unexpected behavior in the Soroban smart contracts
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below to help us reproduce and resolve it.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What versions of Rust, Soroban SDK, and Stellar CLI are you using?
      placeholder: "e.g. Rust 1.81.0, soroban-sdk 22.0.8, stellar-cli 22.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Code snippet, test case, or sequence of CLI commands to reproduce.
      placeholder: |
        1. Register participant ...
        2. Attempt batch registration with ...
        3. Observe contract panics or returns unexpected error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
